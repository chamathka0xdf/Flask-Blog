[project]
name = "flask-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chamathka" }
]
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "pillow>=12.3.0",
    "psycopg2>=2.9.12",
]

[project.scripts]
flask-blog = "flask_blog:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
